name: nexetl

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${NEXETL_DB_NAME:-nexetl}
      POSTGRES_USER: ${NEXETL_DB_USER:-nexetl}
      POSTGRES_PASSWORD: ${NEXETL_DB_PASSWORD:?NEXETL_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${NEXETL_DB_PORT:-5432}:5432"
    volumes:
      - nexetl-postgres-data:/var/lib/postgresql

volumes:
  nexetl-postgres-data:
